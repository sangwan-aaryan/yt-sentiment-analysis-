name: CI/CD Pipeline

on:
  push:

jobs:
  model-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run DVC pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: dvc repro

      - name: Test model artifacts
        env:
          MLFLOW_TRACKING_URI: http://16.178.121.158:5000
        run: >
          python -m pytest
          scripts/test_load_model.py
          scripts/test_model_signature.py
          scripts/test_model_performance.py

      - name: Start Flask API
        env:
          MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
          MLFLOW_TRACKING_URI: http://16.178.121.158:5000
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          nohup python backend/main.py > flask_app.log 2>&1 &
          echo $! > flask_app.pid

          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"sentiment_counts":{"1":1,"0":1,"-1":1}}' \
              http://127.0.0.1:5000/generate_chart || true)
            if [ "$status" = "200" ]; then
              echo "Flask API is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Flask API did not become ready"
          cat flask_app.log
          exit 1

      - name: Test Flask API
        run: python -m pytest scripts/test_flask_api.py

      - name: Build Docker image
        run: docker build --tag yt-sentiment-comment:latest .

      - name: Smoke-test Docker image
        run: |
          docker run --detach --rm \
            --name yt-sentiment-comment-test \
            --publish 5001:5000 \
            yt-sentiment-comment:latest

          for attempt in {1..30}; do
            if curl --silent --fail --output /dev/null \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"comments":["This container test is wonderfully useful","Docker deployment is ready for validation"]}' \
              http://127.0.0.1:5001/generate_wordcloud; then
              echo "Docker container is ready"
              docker stop yt-sentiment-comment-test
              exit 0
            fi
            sleep 2
          done

          echo "Docker container did not become ready"
          docker logs yt-sentiment-comment-test
          docker stop yt-sentiment-comment-test || true
          exit 1

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        if: github.ref == 'refs/heads/master'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag yt-sentiment-comment:latest \
            "$ECR_REGISTRY/yt-sentiment-comment:latest"
          docker tag yt-sentiment-comment:latest \
            "$ECR_REGISTRY/yt-sentiment-comment:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/yt-sentiment-comment:latest"
          docker push "$ECR_REGISTRY/yt-sentiment-comment:${GITHUB_SHA}"

      - name: Prepare CodeDeploy bundle
        if: github.ref == 'refs/heads/master'
        run: |
          chmod +x deploy/scripts/install_dependencies.sh deploy/scripts/start_docker.sh
          printf '%s\n' "$GITHUB_SHA" > deploy/image-tag.txt
          zip -j deployment.zip appspec.yml
          zip -r deployment.zip deploy

      - name: Upload CodeDeploy bundle
        if: github.ref == 'refs/heads/master'
        run: |
          aws s3 cp deployment.zip \
            "s3://code-deploy-aaryan/deployment-${GITHUB_SHA}.zip" \
            --region ap-southeast-2

      - name: Deploy to AWS CodeDeploy
        if: github.ref == 'refs/heads/master'
        run: |
          deployment_id=$(aws deploy create-deployment \
            --application-name yt-chrome \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --deployment-group-name yt-chrome \
            --s3-location "bucket=code-deploy-aaryan,key=deployment-${GITHUB_SHA}.zip,bundleType=zip" \
            --file-exists-behavior OVERWRITE \
            --region ap-southeast-2 \
            --query deploymentId \
            --output text)
          echo "Waiting for CodeDeploy deployment $deployment_id"
          aws deploy wait deployment-successful \
            --deployment-id "$deployment_id" \
            --region ap-southeast-2

      - name: Promote model to production
        if: github.ref == 'refs/heads/master'
        env:
          MLFLOW_TRACKING_URI: http://16.178.121.158:5000
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python scripts/promote_model.py
