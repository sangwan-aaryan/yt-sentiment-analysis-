name: CICD Pipeline

on: push

jobs:
  model-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1  # Replace with your AWS region
        run: |
          dvc repro

      - name: Test registered model and local model artifacts
        run: |
          python -m pytest scripts/test_load_model.py scripts/test_model_signature.py scripts/test_model_performance.py

      - name: Promote model to production
        env:
          MLFLOW_TRACKING_URI: http://16.178.121.158:5000
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python scripts/promote_model.py

      - name: Start Flask App
        env:
          MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
          MLFLOW_TRACKING_URI: http://16.178.121.158:5000
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          nohup python backend/main.py > flask_app.log 2>&1 &
          echo $! > flask_app.pid

          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"sentiment_counts":{"1":1,"0":1,"-1":1}}' \
              http://127.0.0.1:5000/generate_chart || true)
            if [ "$status" = "200" ]; then
              echo "Flask API is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Flask API did not become ready"
          cat flask_app.log
          exit 1

      - name: Run Flask API tests
        run: |
          python -m pytest scripts/test_flask_api.py

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          

      - name: Add changes to Git
        run: |
          git add .

      - name: Commit changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git commit -m "Automated commit of DVC outputs and updated code" || echo "No changes to commit"

      - name: Push changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin ${{ github.ref_name }}